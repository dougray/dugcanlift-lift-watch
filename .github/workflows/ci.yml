name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Wear OS test, lint, assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      # Caches ~/.gradle and validates the wrapper jar checksum.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Unit tests
        run: ./gradlew :liftkit:test :wear:testDebugUnitTest --rerun

      - name: Android lint
        run: ./gradlew :wear:lintDebug

      - name: Assemble debug APK
        run: ./gradlew :wear:assembleDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wear-lint-report
          path: android/wear/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lift-wear-debug-apk
          path: android/wear/build/outputs/apk/debug/wear-debug.apk
          retention-days: 7

  apple:
    name: watchOS test and build
    # macos-26 ships Xcode 26.6, matching local. A simulator build needs no
    # signing identity, so the free Personal Team is not a problem here.
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apple
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Install xcodegen and xcbeautify
        run: brew install xcodegen xcbeautify

      # LiftKit domain tests: swift test, no simulator. The trailing
      # swift-testing "0 tests in 0 suites" line is expected; the XCTest
      # "Executed N tests" line above it is the real count.
      - name: LiftKit unit tests
        run: make test

      # The app itself has no test target; compiling it for the watch
      # simulator is what catches a broken build. The generic destination
      # builds against the simulator SDK without needing a booted device:
      # the runner image only carries a subset of the watch simulators and
      # not the Series 11 the Makefile defaults to.
      - name: Build for the watch simulator
        run: make build DEST='generic/platform=watchOS Simulator'
